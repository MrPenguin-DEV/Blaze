[workspace]
resolver = "2"
members = [
    "crates/blaze-core",
    "crates/blaze-browser",
    "crates/blaze-vault",
    "crates/blaze-workspace",
    "crates/blaze-wasm",
    "crates/blaze-desktop",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2.5"
eframe = "0.37"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
wasmi = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
