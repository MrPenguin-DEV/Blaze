name: Rust CI

on:
  push:
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
      - "LICENSE-*"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
      - "LICENSE-*"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: blaze-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  default:
    name: Format, check, and test (workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang \
            libasound2-dev libudev-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies (including Quackdoc epaint Vello fix)
        run: cargo fetch

      - name: Install the WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the example Blaze WASM app
        run: cargo build --manifest-path examples/wasm-webapp/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Check workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

  servo-browser:
    name: Compile embedded Servo browser in the unified executable
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Servo graphics and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang \
            libasound2-dev libudev-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies and patch epaint Vello glyph rendering
        run: |
          cargo fetch
          python3 scripts/patch-epaint-vello.py

      - name: Inspect Fontconfig feature selection
        run: cargo tree -p blaze-desktop --features servo-browser -e features -i yeslogic-fontconfig-sys

      - name: Check embedded Servo browser
        run: cargo check -p blaze-desktop --features servo-browser --bin blaze
