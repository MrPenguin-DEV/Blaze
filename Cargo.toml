[workspace]
resolver = "2"
members = [
    "crates/blaze-core",
    "crates/blaze-browser",
    "crates/blaze-vault",
    "crates/blaze-workspace",
    "crates/blaze-wasm",
    "crates/blaze-cache",
    "crates/blaze-desktop",
    "crates/blaze-office",
    "crates/blaze-profile",
    "crates/blaze-comms",
]

[workspace.package]
version = "0.0.1-beta"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2.5"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "glow", "x11"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
wasmi = "2.0"
sha2 = "0.10"
office_oxide = "0.1.16"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
# Keep every egui-family crate on the same Git revision. Patching only epaint
# mixes Git and crates.io emath/ecolor types and causes hundreds of type errors.
egui = { git = "https://github.com/Quackdoc/egui", branch = "vello_fix" }
epaint = { git = "https://github.com/Quackdoc/egui", branch = "vello_fix" }
emath = { git = "https://github.com/Quackdoc/egui", branch = "vello_fix" }
ecolor = { git = "https://github.com/Quackdoc/egui", branch = "vello_fix" }
epaint_default_fonts = { git = "https://github.com/Quackdoc/egui", branch = "vello_fix" }
egui-winit = { git = "https://github.com/Quackdoc/egui", branch = "vello_fix" }
egui_glow = { git = "https://github.com/Quackdoc/egui", branch = "vello_fix" }
