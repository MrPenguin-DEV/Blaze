[workspace]
resolver = "2"
members = [
    "crates/blaze-core",
    "crates/blaze-browser",
    "crates/blaze-vault",
    "crates/blaze-workspace",
    "crates/blaze-wasm",
    "crates/blaze-cache",
    "crates/blaze-desktop",
    "crates/blaze-office",
    "crates/blaze-profile",
    "crates/blaze-comms",
]

[workspace.package]
version = "0.0.1-beta"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2.5"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "glow", "x11"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
wasmi = "2.0"
sha2 = "0.10"
office_oxide = "0.1.16"

# Temporary upstream fix: flush Vello CPU glyph work before rasterization.
# Keep the patch scoped to epaint; use a fork revision based on the exact
# crates.io egui 0.37 dependency set to avoid mixing egui/emath versions.
[patch.crates-io]
epaint = { git = "https://github.com/Quackdoc/egui", rev = "11c32981caaafedee9ca171b13a91bc73fd71bf6" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
