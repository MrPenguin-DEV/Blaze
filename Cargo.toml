[workspace]
resolver = "2"
members = [
    "crates/blaze-core",
    "crates/blaze-browser",
    "crates/blaze-vault",
    "crates/blaze-workspace",
    "crates/blaze-wasm",
    "crates/blaze-cache",
    "crates/blaze-desktop",
    "crates/blaze-office",
    "crates/blaze-profile",
    "crates/blaze-comms",
]

[workspace.package]
version = "0.0.1-beta"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2.5"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "glow", "x11"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
wasmi = "2.0"
sha2 = "0.10"
office_oxide = "0.1.16"

# Temporary upstream fix: epaint must flush Vello CPU glyph work when Servo
# enables vello_cpu/multithreading. Remove after this fix is in a released egui.
[patch.crates-io]
# Keep epaint glyph rasterization single-threaded: Servo enables vello_cpu/multithreading
# in this build, and the default glyph RenderContext otherwise inherits it.
# Pinned to the regression fix in egui PR #8823 until it is released upstream.
epaint = { git = "https://github.com/ahmedhosnypro/egui", rev = "0325bcc99f2e8762f970e9275a55340098152ed8" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
