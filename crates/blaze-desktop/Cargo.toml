[package]
name = "blaze-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native GPU-rendered desktop shell for Blaze"

[[bin]]
name = "blaze"
path = "src/main.rs"

[features]
default = []
# Opt-in because Servo pulls in a substantial browser-engine/media dependency tree.
servo-host = [
    "dep:servo",
    "dep:embedder_traits",
    "dep:euclid",
    "dep:winit",
    "dep:webrender_api",
    "dep:tracing",
    "dep:rustls",
]

[dependencies]
blaze-browser = { path = "../blaze-browser" }
blaze-core = { path = "../blaze-core" }
blaze-vault = { path = "../blaze-vault" }
blaze-office = { path = "../blaze-office" }
blaze-profile = { path = "../blaze-profile" }
blaze-comms = { path = "../blaze-comms" }
blaze-wasm = { path = "../blaze-wasm" }
eframe.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
directories = "6"

servo = { version = "=0.7.0", optional = true, features = ["media-gstreamer"] }
embedder_traits = { package = "servo-embedder-traits", version = "=0.7.0", optional = true }
euclid = { version = "0.22", optional = true }
winit = { version = "0.30.13", optional = true }
webrender_api = { version = "0.70", optional = true }
tracing = { version = "0.1", optional = true }
rustls = { version = "0.23", features = ["aws_lc_rs"], optional = true }

[lints]
workspace = true
